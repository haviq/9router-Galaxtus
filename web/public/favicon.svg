<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Space Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1326"/>
      <stop offset="50%" stop-color="#181336"/>
      <stop offset="100%" stop-color="#080a14"/>
    </linearGradient>

    <!-- Spiral Arm 1 (Cyan to Violet) -->
    <linearGradient id="arm1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="35%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#818cf8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Spiral Arm 2 (Rose to Amber to Gold) -->
    <linearGradient id="arm2" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0"/>
      <stop offset="35%" stop-color="#fb7185" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#fb923c" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>

    <!-- Core Radiant Flare -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#fef08a" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#fb923c" stop-opacity="0.6"/>
      <stop offset="80%" stop-color="#818cf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="40%" stop-color="#c084fc" stop-opacity="0.75"/>
      <stop offset="70%" stop-color="#fb923c" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Planet Gradient -->
    <radialGradient id="planetGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="45%" stop-color="#ea580c"/>
      <stop offset="85%" stop-color="#431407"/>
      <stop offset="100%" stop-color="#1c0502"/>
    </radialGradient>

    <!-- Filter for soft glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base with Metallic Rim -->
  <rect width="64" height="64" rx="17" fill="url(#bgGrad)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="16.25" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1.5"/>

  <!-- Ambient Cosmic Dust & Nebula Glow -->
  <circle cx="32" cy="32" r="22" fill="url(#coreGlow)" filter="url(#glow)"/>

  <!-- Tilted Orbital Ring Ellipse -->
  <ellipse cx="32" cy="32" rx="23" ry="8.5" transform="rotate(-28 32 32)" stroke="url(#ringGrad)" stroke-width="1.8" stroke-dasharray="140" stroke-dashoffset="15" opacity="0.85"/>

  <!-- Spiral Galaxy Arm 1 -->
  <path d="M 12 21 C 13 14, 23 11, 31 14 C 40 17, 44 26, 42 34 C 40 41, 33 44, 27 42 C 22 40, 20 34, 24 29 C 27 25, 33 26, 33 30 C 33 33, 30 33, 30 32"
        fill="none" stroke="url(#arm1)" stroke-width="3" stroke-linecap="round"/>

  <!-- Spiral Galaxy Arm 2 -->
  <path d="M 52 43 C 51 50, 41 53, 33 50 C 24 47, 20 38, 22 30 C 24 23, 31 20, 37 22 C 42 24, 44 30, 40 35 C 37 39, 31 38, 31 34 C 31 31, 34 31, 34 32"
        fill="none" stroke="url(#arm2)" stroke-width="3" stroke-linecap="round"/>

  <!-- Micro Twinkling Stardust Dots -->
  <circle cx="16" cy="38" r="0.9" fill="#ffffff" opacity="0.8"/>
  <circle cx="20" cy="18" r="0.75" fill="#38bdf8" opacity="0.9"/>
  <circle cx="48" cy="24" r="0.85" fill="#fef08a" opacity="0.85"/>
  <circle cx="45" cy="46" r="0.7" fill="#f43f5e" opacity="0.75"/>
  <circle cx="28" cy="12" r="1.1" fill="#ffffff" opacity="0.95"/>
  <circle cx="36" cy="52" r="0.9" fill="#c084fc" opacity="0.8"/>

  <!-- Orbiting Gas Pearl Planet (Upper-Right) -->
  <circle cx="47" cy="19" r="4.2" fill="url(#planetGrad)"/>
  <ellipse cx="47" cy="19" rx="6.5" ry="1.6" transform="rotate(-20 47 19)" stroke="#fed7aa" stroke-width="0.8" opacity="0.85"/>

  <!-- Central Supermassive Stellar Core (Blazing Diamond Flare) -->
  <path d="M 32 24 L 33.6 30.4 L 40 32 L 33.6 33.6 L 32 40 L 30.4 33.6 L 24 32 L 30.4 30.4 Z" fill="#ffffff"/>
  <circle cx="32" cy="32" r="2.2" fill="#fff7ed"/>
</svg>